name: Verify and Package

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Tag packaging checks that the tagged commit belongs to main history.
          fetch-depth: 0

      - name: Check tag belongs to main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package.json version');
          NODE

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # test builds the CLI and Viewer and includes isolated Skill bundle checks.
      - name: Build and test
        run: pnpm test

      - name: Verify package contents, installation and removal
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm run check:package

      - name: Build candidate archives
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm run pack:local -- "${{ runner.temp }}/ddflow-packages"

      # CI artifacts are candidate builds; this workflow does not publish releases.
      - name: Upload candidate packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ddflow-${{ github.ref_name }}-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ddflow-packages/*.tgz
            ${{ runner.temp }}/ddflow-packages/SHA256SUMS
            ${{ runner.temp }}/ddflow-packages/INSTALL.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
